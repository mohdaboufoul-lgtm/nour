# Alembic configuration for Nour (DESIGN §5.3 "Migrations and dialects").
#
# The migration chain in nour/db/migrations/versions/ is generated from nour.db.models'
# metadata and then carries the trigger, role and RLS DDL through the same generators
# create_schema() uses (nour/db/engine.py), so tests on SQLite and production on Postgres run
# one schema. Run it with the project venv from the repository root:
#
#   uv run alembic upgrade head            # NOUR_DATABASE_URL names the database
#   uv run alembic -x url=<dsn> upgrade head
#   uv run alembic check                   # empty autogenerate diff == models and migrations agree
#
# The URL is never written here: env.py reads `-x url=`, then `sqlalchemy.url` when a caller set
# it programmatically, then Settings().database_url (NOUR_DATABASE_URL).

[alembic]
script_location = %(here)s/nour/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
