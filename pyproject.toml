[project]
name = "nour"
version = "0.1.0"
description = "Nour: one autonomous agent, two sealed desks, one constitution. Server brain for the Operator and Assistant desks (see docs/SPEC.md)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "typer>=0.12",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "hypothesis>=6.100",
]

[project.scripts]
nour = "nour.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:nour.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["nour"]
