[project]
name = "nour"
version = "0.1.0"
description = "Nour: one autonomous agent, two sealed desks, one constitution. Server brain for the Operator and Assistant desks (see docs/SPEC.md)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "python-ulid>=2.7",
  "jinja2>=3.1",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "typer>=0.12",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "tzdata>=2024.1",
  "adhanpy>=1.0.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
vendors = ["anthropic>=0.40", "openai>=1.40"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "freezegun>=1.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "hypothesis>=6.100",
  "import-linter>=2.0",
]

[project.scripts]
nour = "nour.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:nour.*"]
markers = [
  "gate: phase 0 gate criteria (SPEC §16)",
  "weekly: weekly regression scenarios (SPEC §18, §13)",
  "wallclock: the one test that measures real elapsed time (freezegun tick=True)",
  "postgres: requires a Postgres service (CI job); skipped locally",
]

[tool.coverage.run]
source = ["nour"]
omit = ["nour/adapters/*", "nour/testing/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"nour/core/clock.py" = ["DTZ"]
"nour/core/errors.py" = ["N818"]  # exception names are fixed by DESIGN §3.2

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["nour"]

# Import walls (docs/DESIGN.md §4 and §8). `lint-imports` runs in CI from wave 5 on; before
# that, tests/unit/test_wave_imports.py (wave 0) enforces the same graph incrementally.
[tool.importlinter]
root_package = "nour"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Build waves: a module imports only earlier waves (siblings never import each other)"
type = "layers"
layers = [
  "nour.cli",
  "nour.testing",
  "nour.runtime",
  "nour.ingress | nour.adapters",
  "nour.agent | nour.tools",
  "nour.policy | nour.governance",
  "nour.audit | nour.auth | nour.vault | nour.records | nour.events",
  "nour.db | nour.fakes | nour.language",
  "nour.config",
  "nour.core",
]

[[tool.importlinter.contracts]]
name = "Operator wall: code loaded by the Operator desk never imports the vault or owner mailbox"
type = "forbidden"
source_modules = ["nour.tools.common", "nour.tools.operator"]
forbidden_modules = ["nour.vault"]

[[tool.importlinter.contracts]]
name = "Auditor independence: the auditor never imports the desks, the gate or the loop"
type = "forbidden"
source_modules = ["nour.audit.auditor"]
forbidden_modules = ["nour.agent", "nour.tools", "nour.policy", "nour.governance", "nour.runtime", "nour.vault"]

[[tool.importlinter.contracts]]
name = "Release tokens are minted only by the gate and the approvals queue"
type = "forbidden"
source_modules = ["nour.tools", "nour.records", "nour.vault", "nour.auth", "nour.events", "nour.language"]
forbidden_modules = ["nour.agent.executor"]
