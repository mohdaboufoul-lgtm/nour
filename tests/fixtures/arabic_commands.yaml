# Nour owner-command corpus (SPEC §2, §3, §6, §9, §10, §18).
#
# Ground truth for the owner-thread parser: every entry is a realistic message a Lebanese
# business owner in Dubai would send Nour on his WhatsApp thread, in Lebanese dialect
# (Arabic script), Arabizi ("3ala", "sho el 2akhbar") or code-switched Arabic/English.
# Schema and conventions are documented in tests/fixtures/README.md.
#
# Relative dates ("بكرا", "next Thursday") resolve against reference_now. Every message
# arrives from the owner's registered number (owner_verified=true); voice_note entries
# carry the transcript as text and never carry identity (SPEC §6: voice is never identity).
# <PASSPHRASE> is a literal placeholder; no real passphrase appears anywhere.

version: 1
reference_now: "2026-10-06T09:00:00+04:00"   # Tuesday, Asia/Dubai
timezone: Asia/Dubai
owner_verified: true
passphrase_placeholder: "<PASSPHRASE>"
intents:
  - schedule_meeting
  - reschedule
  - draft_email
  - send_email_owner_name
  - reply_customer
  - pay_invoice
  - add_beneficiary
  - change_beneficiary
  - share_document
  - retrieve_vault_doc
  - update_crm
  - research
  - reminder
  - task_create
  - task_status
  - approve
  - reject
  - kill_switch
  - release_kill_switch
  - set_coat
  - question
  - memory_query
  - memory_delete
  - renewal_check
  - logistics_booking
  - smalltalk
  - constitution_change

